services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: modulith
      POSTGRES_USER: modulith
      POSTGRES_PASSWORD: modulith
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulith -d modulith"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
